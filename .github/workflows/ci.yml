name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Unit tests with coverage; the schema engine's differ and renderer must stay at >= 90% (M3).
      - run: dotnet test --no-build -c Release --project tests/CoreFoundry.UnitTests --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - run: python3 build/check-coverage.py TestResults/coverage.cobertura.xml 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: TestResults/coverage.cobertura.xml
      # Integration tests skip themselves without a MySQL connection string (local MySQL only, D26).
      - run: dotnet test --no-build -c Release --project tests/CoreFoundry.IntegrationTests

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
